services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: artifact
      POSTGRES_DB: artifact_repo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifact -d artifact_repo"]
      interval: 3s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль MinIO
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # веб-консоль RabbitMQ (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://artifact:artifact@db:5432/artifact_repo
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      STORAGE_PROVIDER: minio         # общий склад: все ноды бэкенда видят одни файлы
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: artifacts
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: http://localhost:5173
      INITIAL_ADMIN_LOGIN: admin
      # Обязательно поменяйте: без пароля длиной >=12 суперадмин не будет создан
      INITIAL_ADMIN_PASSWORD: ChangeMe-Please-123
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app        # hot-reload кода
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  jobber:
    build: ./backend                  # тот же образ, что backend
    command: ["python", "-m", "app.jobber.main"]
    environment:
      DATABASE_URL: postgres://artifact:artifact@db:5432/artifact_repo
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: artifacts
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QUARANTINE_SEVERITIES: CRITICAL,HIGH
      RESCAN_INTERVAL_HOURS: "24"
      RESCAN_MAX_AGE_DAYS: "7"
      TRIVY_CACHE_DIR: /trivy-cache
    volumes:
      - ./backend/app:/app/app        # hot-reload кода (общий с backend)
      - trivycache:/trivy-cache       # базы уязвимостей Trivy
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    # Статика, собранная при build образа, раздаётся Angie; он же проксирует
    # /api и /npm на backend. Для разработки с hot-reload запускайте Vite
    # локально: cd frontend && npm run dev (dev-proxy настроен в vite.config.ts)
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  trivycache:
