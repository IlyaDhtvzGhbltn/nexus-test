stages:
  - test
  - build
  - deploy

variables:
  HARBOR_HOST: codd-harbor.mos.ru
  MIRROR: ${HARBOR_HOST}/baseimages
  BACKEND_IMAGE: ${HARBOR_HOST}/${HARBOR_NAMESPACE}/rep-manager-backend:${CI_COMMIT_SHORT_SHA}
  FRONTEND_IMAGE: ${HARBOR_HOST}/${HARBOR_NAMESPACE}/rep-manager-frontend:${CI_COMMIT_SHORT_SHA}

default:
  tags:
    - rep_manager_runner

.harbor_login: &harbor_login
  - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"

# -------- Тесты ----
test:
  stage: test
  script:
    - *harbor_login
    # зеркало pypi требует авторизацию — вставляем логин:пароль нексуса в URL
    - PYPI_URL="$(echo "$PYPI_REGISTRY" | sed "s#^https://#https://${NEXUS_USERNAME}:${NEXUS_PASSWORD}@#")"
    - docker run --rm
        -v "$CI_PROJECT_DIR/backend:/work" -w /work
        -e PIP_INDEX_URL="$PYPI_URL"
        "${MIRROR}/python:3.11-slim"
        sh -c 'pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt && pytest'

# -------- Сборка и публикация образов в Harbor --------
build:
  stage: build
  script:
    - *harbor_login
    - PYPI_URL="$(echo "$PYPI_REGISTRY" | sed "s#^https://#https://${NEXUS_USERNAME}:${NEXUS_PASSWORD}@#")"
    - docker build
        --build-arg BASE_IMAGE="${MIRROR}/astra/ubi18:1.8.7"
        --build-arg TRIVY_IMAGE="${MIRROR}/aquasec/trivy:0.76.1"
        --build-arg PIP_INDEX_URL="$PYPI_URL"
        -t "$BACKEND_IMAGE" backend
    - docker build
        --build-arg NODE_IMAGE="${MIRROR}/node:24-alpine"
        --build-arg ANGIE_IMAGE="${MIRROR}/angie:minimal"
        --build-arg NPM_REGISTRY="$NPM_REGISTRY"
        -t "$FRONTEND_IMAGE" frontend
    - docker push "$BACKEND_IMAGE"
    - docker push "$FRONTEND_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"

# -------- Деплой: compose на этой же машине --------
deploy:
  stage: deploy
  variables:
    COMPOSE_PROJECT_NAME: rep-manager
    UI_PORT: "80"
    POSTGRES_IMAGE: ${MIRROR}/postgres:16-alpine3.20
    RABBITMQ_IMAGE: ${MIRROR}/rabbitmq:4.3.2-management-alpine
    MINIO_IMAGE: ${MIRROR}/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
  script:
    - *harbor_login
    - docker compose pull
    - docker compose up -d --no-build --remove-orphans
    - docker compose ps
  environment:
    name: test-machine
    url: http://10.176.40.113
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"
      when: manual
