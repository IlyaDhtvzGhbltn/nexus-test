# Конфиг Angie: раздача собранной админ-панели + проксирование API и npm-реестра.
# Совместим с nginx (Angie — его форк).

server {
    listen 80;

    root /usr/share/angie/html;
    index index.html;

    # SPA: по любому пути отдаём index.html, маршрутизация на клиенте (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Бэкенд: админ-API и npm-протокол
    location ~ ^/(api|npm)/ {
        proxy_pass http://backend:8000;
        # Host обязателен: бэкенд строит из него ссылки на скачивание пакетов
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # npm publish шлёт весь пакет одним JSON (base64) — поднимаем лимит тела
        client_max_body_size 512m;
        # скачивания стримятся — не буферизуем ответ целиком
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
